<style>
/* Layout: sticky-free single column. Header with two toggles (tab, language), then either a day-by-day schedule (date column left, timeline right) or the packing checklist (one emphasised list plus a wrapping grid of category lists). */
:root {
  --bg: #f3f2ec;
  --fg: #1e2a24;
  --muted: #5c6a62;
  --line: #d7d9cd;
  --soft: #e8ebdf;
  --accent: #1f5a46;
  --accent-ink: #ffffff;
  --alert: #b8451f;
  --alert-bg: #f9e6dc;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Noto Sans JP", system-ui, sans-serif;
  --font-body: "Public Sans", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c18; --fg: #e8ece4; --muted: #9aa89f; --line: #2c3932; --soft: #1e2924;
    --accent: #6fcfa4; --accent-ink: #0f2018; --alert: #f2916b; --alert-bg: #2e1d15;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c18; --fg: #e8ece4; --muted: #9aa89f; --line: #2c3932; --soft: #1e2924;
  --accent: #6fcfa4; --accent-ink: #0f2018; --alert: #f2916b; --alert-bg: #2e1d15;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
a { color: var(--accent); text-underline-offset: 3px; }
#root { display: flex; flex-direction: column; gap: 32px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
header { display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-weight: 500; font-size: .95rem; color: var(--fg); background: transparent; border: 0; padding: 8px 16px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h2 small { font-family: var(--font-body); font-weight: 500; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 0; padding: 0; }
section { min-width: 0; }
.block { display: flex; flex-direction: column; gap: 14px; }
.block > h2 { padding-bottom: 6px; border-bottom: 2px solid var(--fg); }

/* Schedule */
.day { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 8px 32px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.day:first-child { padding-top: 6px; }
.d-date { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 0 0 2px; }
.d-line { margin: 0; overflow-wrap: anywhere; }
.d-route { font-weight: 500; }
.d-stay { color: var(--muted); }
.d-dinner { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.d-dinner b { font-weight: 600; color: var(--fg); }
.plan li { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 10px; padding: 3px 0; }
.plan .tm { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.plan .tx { overflow-wrap: anywhere; }
@media (max-width: 640px) { .day { grid-template-columns: minmax(0, 1fr); } }

/* Checklists */
.chk label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; cursor: pointer; border-bottom: 1px solid var(--line); }
.chk input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); cursor: pointer; }
.chk .t { min-width: 0; overflow-wrap: anywhere; }
.chk input:checked ~ .t { color: var(--muted); text-decoration: line-through; }
.two-col { columns: 2 340px; column-gap: 32px; }
.two-col li { break-inside: avoid; }

.links { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.links a { font-weight: 500; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 420px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; padding-right: 0; white-space: nowrap; }
tr.total td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--fg); }

/* Packing */
.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.count { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
.clear { font: inherit; font-size: .85rem; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.clear:hover { color: var(--fg); border-color: var(--muted); }
.priority { background: var(--alert-bg); border: 2px solid var(--alert); border-radius: 10px; padding: 20px max(16px, 3vw); display: flex; flex-direction: column; gap: 10px; }
.priority h2 { color: var(--alert); font-size: 1.5rem; font-weight: 800; }
.priority h2 small { color: var(--alert); }
.priority .chk label { border-bottom-color: color-mix(in srgb, var(--alert) 30%, transparent); }
.priority .chk input { accent-color: var(--alert); }
.grid { columns: 300px; column-gap: 36px; }
.grid section { display: flex; flex-direction: column; gap: 6px; break-inside: avoid; margin-bottom: 32px; }
.grid h2 { padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
</style>

function mapsUrl(q) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
var PLACE_RE = {};
function linkPlaces(html) {
  var i = LANG === "ja" ? 1 : 0;
  var lookup = {};
  PLACES.forEach(function (p) { lookup[esc(p[i])] = p[2]; });
  if (!PLACE_RE[i]) {
    var keys = PLACES.map(function (p) { return esc(p[i]); }).sort(function (a, b) { return b.length - a.length; });
    PLACE_RE[i] = new RegExp(keys.map(function (k) { return k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|"), "g");
  }
  return html.replace(PLACE_RE[i], function (m) {
    return '<a href="' + mapsUrl(lookup[m]) + '" target="_blank" rel="noopener">' + m + "</a>";
  });
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function fmtTime(t, ap) { return LANG === "ja" ? (ap === "am" ? "午前" : "午後") + t : t + " " + ap; }
function money(n) { return "$" + n.toFixed(2); }

function checkList(entries, group, extraClass) {
  return '<ul class="chk ' + (extraClass || "") + '">' + entries.map(function (e) {
    var id = group + "-" + e.i;
    return '<li><label for="' + id + '"><input type="checkbox" id="' + id + '" data-key="' + id + '"' + (STATE[id] ? " checked" : "") + '><span class="t">' + esc(L(e.it)) + "</span></label></li>";
  }).join("") + "</ul>";
}

    if (d.s) {
      var name = esc(L(d.s));
      h += '<p class="d-line d-stay">' + (d.s[2] ? '<a href="' + mapsUrl(d.s[2]) + '" target="_blank" rel="noopener">' + name + "</a>" : name) + "</p>";
    }
    if (d.n) h += '<p class="d-line d-dinner"><b>' + esc(L(T.dinner)) + "</b>" + esc(L(d.n)) + "</p>";

  var total = 0;
  h += '<section class="block"><h2>' + esc(L(T.budget)) + '</h2><div class="tablewrap"><table><thead><tr><th>' + esc(L(T.colStay)) + "</th><th>" + esc(L(T.colDates)) + '</th><th class="num">' + esc(L(T.colCost)) + "</th></tr></thead><tbody>";
  BUDGET.forEach(function (b) {
    total += b[4];
    h += "<tr><td>" + esc(LANG === "ja" ? b[1] : b[0]) + "</td><td>" + esc(LANG === "ja" ? b[3] : b[2]) + '</td><td class="num">' + (b[4] ? money(b[4]) : esc(L(T.free))) + "</td></tr>";

  h += '<tr class="total"><td>' + esc(L(T.total)) + '</td><td></td><td class="num">' + money(total) + "</td></tr></tbody></table></div></section>";

function renderPacking() {
  var h = '<div class="seg" role="group" aria-label="Person" id="people"><button type="button" data-person="H" aria-pressed="' + (PERSON === "H") + '">Harry</button><button type="button" data-person="R" aria-pressed="' + (PERSON === "R") + '">Hirry</button></div><div class="progress"><div class="progress-row"><span class="count" id="total"></span><button class="clear" id="clear" type="button">' + esc(L(T.clear)) + '</button></div><div class="bar" role="progressbar" aria-label="' + esc(L(T.listPackLabel)) + '" id="barwrap"><span id="bar"></span></div></div>';

  h += '<div class="grid">' + CATS.map(function (c, i) { return { c: c, i: i }; }).filter(function (e) { return (e.c.o || "H") === PERSON; }).map(function (e) {
    return "<section><h2>" + esc(LANG === "ja" ? e.c.ja : e.c.en) + ' <small data-count></small></h2>' + checkList(e.c.items.map(function (it, j) { return { it: it, i: j }; }), "c" + e.i) + "</section>";
  }).join("") + "</div>";
  return h;
}

function updateCounts() {
  var scope = document.getElementById("root");
  if (TAB !== "packing") return;
  var boxes = scope.querySelectorAll("input[type=checkbox]"), done = 0;
  boxes.forEach(function (b) { if (b.checked) done++; });
  var tot = document.getElementById("total");
  tot.textContent = LANG === "ja" ? boxes.length + " 件中 " + done + " 件パッキング済み" : done + " of " + boxes.length + " packed";
  var pct = boxes.length ? Math.round(done / boxes.length * 100) : 0;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("barwrap").setAttribute("aria-valuenow", pct);
  scope.querySelectorAll("section").forEach(function (s) {
    var c = s.querySelector("[data-count]");
    if (!c) return;
    var bs = s.querySelectorAll("input[type=checkbox]"), d = 0;
    bs.forEach(function (b) { if (b.checked) d++; });
    c.textContent = d + "/" + bs.length;
  });
}

function render() {
  document.documentElement.lang = LANG === "ja" ? "ja" : "en";
  document.getElementById("title").textContent = L(T.title);
  document.getElementById("sub").textContent = L(T.sub);
  document.getElementById("tab-schedule").textContent = L(T.tabSchedule);
  document.getElementById("tab-packing").textContent = L(T.tabPacking);
  document.querySelectorAll("#tabs button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-tab") === TAB ? "true" : "false"); });
  document.querySelectorAll("#langs button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false"); });
  document.getElementById("root").innerHTML = (TAB === "schedule") ? renderSchedule() : renderPacking();
  if (TAB === "packing") wireClear();
  updateCounts();
}

var armed = false, timer;
function wireClear() {
  var btn = document.getElementById("clear");
  armed = false;
  btn.addEventListener("click", function () {
    if (!armed) {
      armed = true; btn.textContent = L(T.clearArmed);
      timer = setTimeout(function () { armed = false; btn.textContent = L(T.clear); }, 3000);
      return;
    }
    clearTimeout(timer); armed = false; btn.textContent = L(T.clear);
    document.querySelectorAll("#root input[type=checkbox]").forEach(function (b) { delete STATE[b.getAttribute("data-key")]; b.checked = false; });
    save();
    updateCounts();
  });
}

document.getElementById("root").addEventListener("change", function (e) {
  var k = e.target && e.target.getAttribute("data-key");
  if (!k) return;
  if (e.target.checked) STATE[k] = 1; else delete STATE[k];
  save(); updateCounts();
});
document.getElementById("tabs").addEventListener("click", function (e) {
  var t = e.target.getAttribute && e.target.getAttribute("data-tab");
  if (!t) return;
  TAB = t; save(); render();
});
document.getElementById("langs").addEventListener("click", function (e) {
  var l = e.target.getAttribute && e.target.getAttribute("data-lang");
  if (!l) return;
  LANG = l; save(); render();
});

document.getElementById("root").addEventListener("click", function (e) {
  var p = e.target.getAttribute && e.target.getAttribute("data-person");
  if (!p) return;
  PERSON = p; save(); render();
});
